name: Unzip Wolfram Equation Solver

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # This step looks for the zip file in multiple common places with the new name
      - name: Unzip Wolfram Equation Solver
        run: |
          if [ -f "wolfram-equation-solver/wolfram-equation-solver.zip" ]; then
            echo "Found zip inside wolfram-equation-solver folder."
            unzip wolfram-equation-solver/wolfram-equation-solver.zip -d wolfram-equation-solver
          elif [ -f "wolfram equation solver/wolfram equation solver.zip" ]; then
            echo "Found zip inside wolfram equation solver folder."
            unzip "wolfram equation solver/wolfram equation solver.zip" -d "wolfram-equation-solver"
          elif [ -f "wolfram-equation-solver.zip" ]; then
            echo "Found zip in root."
            unzip wolfram-equation-solver.zip -d wolfram-equation-solver
          elif [ -f "wolfram equation solver.zip" ]; then
            echo "Found zip in root."
            unzip "wolfram equation solver.zip" -d "wolfram-equation-solver"
          else
            echo "Error: Could not find wolfram-equation-solver.zip"
            exit 1
          fi

      # Commits the unzipped files directly back to your repository
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Automated unzip of wolfram-equation-solver" || echo "No changes to commit"
          git push
